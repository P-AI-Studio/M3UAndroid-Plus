name: M3UAndroid Plus — ARM64 APK and Play App Bundle

on:
  push:
    branches: [ master, plus-implementation ]
    paths:
      - '.github/workflows/build-plus.yml'
      - 'm3u_enhancement_pack/**'
      - 'app/**'
      - 'data/**'
      - 'extension/**'
      - 'i18n/**'
  workflow_dispatch:

concurrency:
  group: m3uandroid-plus-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: '37.0'
  ANDROID_BUILD_TOOLS: '37.0.0'

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify Plus source is integrated
        run: |
          set -euo pipefail
          test -f app/smartphone/src/main/java/com/m3u/smartphone/ui/business/advanced/AdvancedToolsScreen.kt
          grep -F 'applicationId = "com.m3u.smartphone.enhanced"' app/smartphone/build.gradle.kts
          grep -F 'targetSdk = 36' app/smartphone/build.gradle.kts
          grep -F 'versionName = "1.15.3-plus3"' app/smartphone/build.gradle.kts
          python3 -m unittest discover -s m3u_enhancement_pack/tests -v

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 preview platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=1 \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "platform-tools" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;28.2.13676358"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          if [[ ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"

      - name: Configure dedicated Plus upload-key signing when repository secrets exist
        id: signing
        env:
          M3U_RELEASE_KEYSTORE_BASE64: ${{ secrets.M3U_RELEASE_KEYSTORE_BASE64 }}
          M3U_RELEASE_STORE_PASSWORD: ${{ secrets.M3U_RELEASE_STORE_PASSWORD }}
          M3U_RELEASE_KEY_ALIAS: ${{ secrets.M3U_RELEASE_KEY_ALIAS }}
          M3U_RELEASE_KEY_PASSWORD: ${{ secrets.M3U_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$M3U_RELEASE_KEYSTORE_BASE64" && \
                -n "$M3U_RELEASE_STORE_PASSWORD" && \
                -n "$M3U_RELEASE_KEY_ALIAS" && \
                -n "$M3U_RELEASE_KEY_PASSWORD" ]]; then
            echo "$M3U_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/m3u-plus-upload.jks"
            test -s "$RUNNER_TEMP/m3u-plus-upload.jks"
            echo "M3U_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/m3u-plus-upload.jks" >> "$GITHUB_ENV"
            echo "M3U_RELEASE_STORE_PASSWORD=$M3U_RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "M3U_RELEASE_KEY_ALIAS=$M3U_RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "M3U_RELEASE_KEY_PASSWORD=$M3U_RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "build_kind=Release" >> "$GITHUB_OUTPUT"
            echo "Upload-key secrets are configured; a Play-uploadable AAB will be built."
          else
            echo "build_kind=ReleasePreview" >> "$GITHUB_OUTPUT"
            echo "Upload-key secrets are not configured; building a Release APK only. No debug-signed AAB will be published."
          fi

      - name: Build optimized ARM64 Release APK (and signed AAB when upload key is configured)
        env:
          BUILD_KIND: ${{ steps.signing.outputs.build_kind }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BUILD_KIND" == "Release" ]]; then
            ./gradlew --no-daemon --stacktrace --console=plain -Pm3uArm64=true \
              :app:smartphone:assembleRelease :app:smartphone:bundleRelease
          else
            ./gradlew --no-daemon --stacktrace --console=plain -Pm3uArm64=true \
              :app:smartphone:assembleRelease
          fi

      - name: Verify package, target SDK, ARM64 ABI and APK signature
        env:
          BUILD_KIND: ${{ steps.signing.outputs.build_kind }}
        shell: bash
        run: |
          set -euo pipefail
          APK=""
          while IFS= read -r candidate; do
            if unzip -l "$candidate" | grep -q 'lib/arm64-v8a/'; then
              APK="$candidate"
              break
            fi
          done < <(find app/smartphone/build/outputs -type f -name '*.apk' | sort)
          test -n "$APK" || {
            echo 'No APK containing ARM64 native libraries was produced.'
            find app/smartphone/build/outputs -type f -name '*.apk' || true
            exit 1
          }
          AAPT="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='com.m3u.smartphone.enhanced'" "$RUNNER_TEMP/badging.txt"
          grep -F "targetSdkVersion:'36'" "$RUNNER_TEMP/badging.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/' | head -n 10

          # Google Play's 16 KB page-size compatibility: verify APK ZIP alignment
          # and every packaged ELF LOAD segment, not just the presence of .so files.
          ZIPALIGN="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/zipalign"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          python3 - "$APK" "$ANDROID_HOME" <<'PY'
          import pathlib, re, subprocess, sys, tempfile, zipfile
          apk = pathlib.Path(sys.argv[1])
          android_home = pathlib.Path(sys.argv[2])
          ndk_root = android_home / "ndk"
          ndks = sorted(p for p in ndk_root.iterdir() if p.is_dir()) if ndk_root.exists() else []
          if not ndks:
              raise SystemExit("No Android NDK installed; cannot verify ELF 16 KB alignment.")
          ndk = ndks[-1]
          tool = ndk / "toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          if not tool.exists():
              raise SystemExit(f"llvm-objdump missing in {ndk}")
          bad = []
          with tempfile.TemporaryDirectory() as tmp, zipfile.ZipFile(apk) as z:
              for name in z.namelist():
                  if not name.startswith("lib/arm64-v8a/") or not name.endswith(".so"):
                      continue
                  dest = pathlib.Path(tmp) / pathlib.Path(name).name
                  dest.write_bytes(z.read(name))
                  output = subprocess.check_output([str(tool), "-p", str(dest)], text=True)
                  loads = [int(x) for x in re.findall(r"LOAD\s+.*?align\s+2\*\*(\d+)", output)]
                  if not loads or min(loads) < 14:
                      bad.append((name, loads))
          if bad:
              for name, loads in bad:
                  print(f"UNALIGNED: {name}: LOAD alignments={loads}")
              raise SystemExit("At least one ARM64 native library is not 16 KB ELF aligned.")
          print("All packaged ARM64 ELF LOAD segments are 16 KB aligned.")
          PY

          mkdir -p dist
          cp "$APK" "dist/M3UAndroid-1.15.3-plus3-arm64-${BUILD_KIND,,}.apk"
          if [[ "$BUILD_KIND" == "Release" ]]; then
            AAB="app/smartphone/build/outputs/bundle/release/app-smartphone-release.aab"
            test -s "$AAB" || { echo 'Release AAB was not produced'; exit 1; }
            jarsigner -verify "$AAB"
            cp "$AAB" "dist/M3UAndroid-1.15.3-plus3-arm64-release.aab"
            sha256sum "dist/M3UAndroid-1.15.3-plus3-arm64-release.apk" "dist/M3UAndroid-1.15.3-plus3-arm64-release.aab" > dist/SHA256SUMS.txt
          else
            sha256sum "dist/M3UAndroid-1.15.3-plus3-arm64-releasepreview.apk" > dist/SHA256SUMS.txt
          fi
          printf '%s\n' "$BUILD_KIND" > dist/BUILD_KIND.txt

      - name: Upload verified Android package
        uses: actions/upload-artifact@v4
        with:
          name: M3UAndroid-Plus-1.15.3-${{ steps.signing.outputs.build_kind }}-ARM64
          path: dist/
          if-no-files-found: error
          retention-days: 30
