name: Apply M3UAndroid Plus source patch

on:
  push:
    branches: [ plus-implementation ]
    paths:
      - 'RUN_PLUS_PATCH'

permissions:
  contents: write

concurrency:
  group: m3u-plus-patch-bootstrap
  cancel-in-progress: false

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: plus-implementation
          fetch-depth: 0

      - name: Verify patch marker and extract the complete archive
        shell: bash
        run: |
          set -euo pipefail
          test -f RUN_PLUS_PATCH
          cat m3u-plus-patch.part* > "$RUNNER_TEMP/plus-patch.tar.xz.b64"
          base64 --decode "$RUNNER_TEMP/plus-patch.tar.xz.b64" | tar -xJf -

      - name: Apply only the authored Plus changes and run tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile m3u_enhancement_pack/apply.py
          python3 m3u_enhancement_pack/apply.py --source .
          python3 -m unittest discover -s m3u_enhancement_pack/tests -v
          rm -rf .m3u-plus-patch-backup
          rm -f m3u-plus-patch.tar.xz.b64 m3u-plus-patch.part*

      - name: Commit Plus integration without touching other branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply M3UAndroid Plus feature set'
          git push origin HEAD:plus-implementation
