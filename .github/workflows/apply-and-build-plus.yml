name: Apply M3UAndroid Plus source patch

on:
  push:
    branches: [ plus-implementation ]
    paths:
      - '.github/workflows/apply-and-build-plus.yml'
      - 'm3u-plus-patch.tar.xz.b64'

permissions:
  contents: write

concurrency:
  group: m3u-plus-patch-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-patch:
    if: \${{ !contains(github.event.head_commit.message, 'Apply M3UAndroid Plus feature set') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: plus-implementation
          fetch-depth: 0

      - name: Extract authored Plus patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f m3u-plus-patch.tar.xz.b64 ]]; then
            echo 'Patch payload has already been consumed.'
            exit 0
          fi
          base64 --decode m3u-plus-patch.tar.xz.b64 | tar -xJf -

      - name: Apply changes and run patch tests
        run: |
          set -euo pipefail
          python3 -m py_compile m3u_enhancement_pack/apply.py
          python3 m3u_enhancement_pack/apply.py --source .
          python3 -m unittest discover -s m3u_enhancement_pack/tests -v
          rm -rf .m3u-plus-patch-backup
          rm -f m3u-plus-patch.tar.xz.b64

      - name: Commit only the applied Plus source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply M3UAndroid Plus feature set'
          git push origin HEAD:plus-implementation
